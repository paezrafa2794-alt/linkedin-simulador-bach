<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Enlaza Aula</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: columna de perfil + muro + consejos en escritorio; muro con barra inferior en teléfono */
:root{
--bg:#FFFFFF;--surface:#FFFFFF;--surface2:#F5F6F8;--ink:#1B2430;--muted:#5D6675;--line:#E4E7EC;
--accent:#0E7C6F;--accent-ink:#FFFFFF;--accent-soft:#E7F4F1;--gold:#8A5A00;--gold-soft:#FBF3DF;
--danger:#B93A2B;--danger-soft:#FBE3DF;
--display:'Cormorant Garamond','Palatino Linotype',Georgia,serif;
--body:'Jost','Century Gothic',system-ui,-apple-system,'Segoe UI',sans-serif;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 92px}
@media(min-width:900px){body{padding-block:0 32px}}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:0;font-weight:600;text-wrap:balance}
h1{font-size:36px;line-height:1.08}
h2.h{font-size:32px;margin:4px 0 0}
h3{font-size:22px;font-weight:700;margin-bottom:10px}
p{margin:0}
.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:12px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.clamp{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* barra superior */
.banner{background:var(--accent-soft);color:var(--ink);font-size:13px;padding:7px 12px;text-align:center;border-radius:0 0 10px 10px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 0}
.brand{display:flex;align-items:center;gap:8px;font:700 27px var(--display);letter-spacing:.01em}
.brand.big{font-size:36px;margin-bottom:18px}
.dnav{display:none;gap:4px;margin-left:auto}
.nv{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font:600 12px var(--body);padding:6px 12px;border-radius:10px;cursor:pointer}
.nv svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nv.on{color:var(--accent)}
.nv .dot{position:absolute;top:2px;right:8px;min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
.pts{margin-left:auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px 5px 6px;font:600 13px var(--body);cursor:pointer}
@media(min-width:900px){.dnav{display:flex}.pts{margin-left:0}}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);
padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
@media(min-width:900px){.tabbar{display:none}}

/* rejilla */
.shell{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);padding-top:16px;align-items:start}
.shell.one{max-width:760px;margin:0 auto}
.col-c{display:grid;gap:14px;min-width:0}
.col-l,.col-r{display:none}
@media(min-width:900px){
.shell:not(.one){grid-template-columns:250px minmax(0,1fr) 280px}
.col-l,.col-r{display:grid;gap:14px;position:sticky;top:76px}
.mob-only{display:none}}

/* componentes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0;box-shadow:0 1px 2px rgba(27,36,48,.05)}
.btn{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.dng{background:var(--danger);border-color:var(--danger);color:#fff}
.btn[disabled]{opacity:.55;cursor:default}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
textarea{resize:vertical}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.chip{border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:999px;padding:4px 12px;font:600 13px var(--body);cursor:pointer}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.types{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.compose .prev{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.compose .prev img{width:120px;max-width:40%;border-radius:10px;border:1px solid var(--line)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);margin-bottom:10px}
.chk input{width:auto;margin-top:3px}
.warn{background:var(--danger-soft);border:1px solid var(--danger);border-radius:10px;padding:10px 14px;margin:8px 0;font-size:14px}
.warn ul{margin:6px 0 6px 18px;padding:0}
.good{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;margin-top:10px;font-size:14px}
.good ul,.warn.bad ul{margin:6px 0 0 18px;padding:0}
.post{display:grid;gap:8px}
.nm{font-weight:600}
.you{background:var(--accent-soft);color:var(--accent);font-size:11px;border-radius:6px;padding:1px 6px;margin-left:4px}
.post-text{overflow-wrap:anywhere}
.tag{color:var(--accent);font-weight:600}
.post-img{width:100%;max-height:440px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.quote{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface2);display:grid;gap:6px;overflow-wrap:anywhere}
.acts{display:flex;gap:4px;border-top:1px solid var(--line);padding-top:6px}
.act{border:0;background:none;color:var(--muted);font:600 13px var(--body);padding:6px 12px;border-radius:8px;cursor:pointer}
.act.on{color:var(--accent);background:var(--accent-soft)}
.cm{display:flex;gap:8px;align-items:flex-start}
.bub{background:var(--surface2);border-radius:12px;padding:6px 12px;min-width:0;overflow-wrap:anywhere;font-size:14px}
.cf{margin-top:2px}
.tip{background:var(--gold-soft);border-color:transparent}
.tip h3{color:var(--gold);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-family:var(--body)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--accent)}
.lv{font:600 13px var(--body);color:var(--accent);letter-spacing:.03em}
.stat{display:flex;gap:16px;margin-top:10px}
.stat b{display:block;font:700 24px var(--display)}
.person{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.person:first-of-type{border-top:0}
.req{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:8px}
.req:first-of-type{border-top:0}
.msgtxt{background:var(--surface2);border-left:3px solid var(--line);padding:8px 12px;border-radius:0 10px 10px 0;font-size:14px;overflow-wrap:anywhere}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.card + .card{margin-top:0}
.shell.one{gap:14px}
.bds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bd{border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;opacity:.5}
.bd.on{opacity:1;background:var(--gold-soft);border-color:transparent}
.bd b{display:block;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.proj{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding:10px 0}
.proj:first-of-type{border-top:0}
.sk{display:inline-flex;gap:6px;align-items:center;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 12px;font-weight:600;font-size:13px}
.sk button{border:0;background:none;color:inherit;cursor:pointer;font-size:15px;padding:0}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-weight:600;font-size:14px}
.hint{color:var(--muted);font-size:12px;margin-top:-6px}
fieldset{border:0;padding:0;margin:0}
legend{font-weight:600;font-size:14px;margin-bottom:6px}
.sw input{position:absolute;opacity:0}
.sw span{display:inline-block;width:34px;height:34px;border-radius:50%;margin-right:6px;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.sw input:checked + span{border-color:var(--surface);box-shadow:0 0 0 3px var(--ink)}
.sw input:focus-visible + span{outline:2px solid var(--accent);outline-offset:3px}
.ob{min-height:100%;display:grid;place-items:center;padding:24px 0}
.ob-in{width:100%;max-width:520px;display:grid;gap:14px}
.chat{display:grid;gap:12px}
.thread{display:grid;gap:8px;max-height:52vh;overflow-y:auto;padding:4px}
.b{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--surface2);overflow-wrap:anywhere;font-size:14px}
.b.me{justify-self:end;background:var(--accent);color:var(--accent-ink)}
.chatrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);padding:10px 0;cursor:pointer;font:inherit}
.chatrow:first-of-type{border-top:0}
.nt{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.nt:first-of-type{border-top:0}
.nt.new{font-weight:600}
.nt i{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:8px;flex:none}
.nt:not(.new) i{background:transparent}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(92vw,460px);text-align:center}
@media(min-width:900px){.toast{bottom:28px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>
<input type="file" id="file" accept="image/*" hidden>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(()=>{
const KEY='enlaza.aula.v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>esc(t).replace(/(^|\s)#([\p{L}][\p{L}\d_]*)/gu,'$1<span class="tag">#$2</span>').replace(/\n/g,'<br>');
const rel=t=>{const s=(Date.now()-t)/1000;if(s<60)return'ahora';if(s<3600)return`hace ${Math.floor(s/60)} min`;if(s<86400)return`hace ${Math.floor(s/3600)} h`;return`hace ${Math.floor(s/86400)} d`};

const AREAS=['Tecnología','Diseño y arte','Salud y bienestar','Negocios y emprendimiento','Educación','Ciencias','Oficios y técnica','Comunicación'];
const COLORS=['#0B8A7A','#E4572E','#3D5AFE','#C2185B','#7B5E00','#5E35B1'];
const TYPES=[['idea','Idea'],['logro','Logro'],['pregunta','Pregunta'],['proyecto','Proyecto']];
const TL=Object.fromEntries(TYPES);
const LEVELS=[['Novato',0],['Explorador',30],['Conectado',80],['Referente',150]];
const BOT={
b1:{name:'Mariana Solís',head:'Diseñadora gráfica · Estudio Brújula',c:'#E4572E'},
b2:{name:'Luis Ramírez',head:'Analista de datos · Laboratorio Cerro Alto',c:'#3D5AFE'},
b3:{name:'Fernanda Ortega',head:'Chef y emprendedora · Cocina Raíz',c:'#8A5A00'},
b4:{name:'Andrea Muñoz',head:'Orientadora vocacional · Red Brújula',c:'#0B8A7A'},
b5:{name:'Tomás Bravo',head:'Técnico electricista · Taller Voltio',c:'#5E35B1'},
b6:{name:'Sofía Karam',head:'Médica veterinaria · Clínica Pata Norte',c:'#C2185B'},
b7:{name:'Ramón Ibarra',head:'Docente de ciencias · Preparatoria Aurora',c:'#2E7D32'},
r2:{name:'Reclutador Premium',head:'Oportunidades de trabajo inmediato',c:'#6B7280'}};
const FRIENDS=['b1','b2','b3','b4','b5','b6'];
const CM={
logro:['¡Felicidades! Se nota el esfuerzo.','Muy buen avance, gracias por compartirlo.','Inspirador. ¿Qué fue lo más difícil?'],
pregunta:['Yo empezaría con algo pequeño y práctico.','Buena pregunta. A mí me ayudó hablar con un mentor.','Busca un proyecto que te guste, así aprendes más rápido.'],
proyecto:['Se ve prometedor, ¡mucha suerte con el proyecto!','¿Necesitan apoyo con algo? Cuenten conmigo.','Gran iniciativa, sigue así.'],
idea:['Gracias por compartir tu idea.','Interesante punto de vista.','Me gustó cómo lo explicas.']};
const REPLY=['Gracias por comentar, {n}. ¡Qué bueno leerte!','Buen punto, {n}. Gracias por sumarte a la conversación.','¡Gracias, {n}! Cuéntame si pruebas la idea.'];
const TIPS=[
'Usa solo tu nombre de pila o un alias. Los apellidos y la escuela ayudan a que alguien te localice.',
'Un número de teléfono o una dirección en una publicación queda visible para cualquiera que la vea.',
'Antes de aceptar una solicitud, revisa si el perfil tiene trayectoria real y si el mensaje no pide nada raro.',
'Si un mensaje te mete prisa o te pide datos, detente, no respondas y avisa a una persona adulta de confianza.',
'Una foto puede mostrar tu casa, tu uniforme o tu calle. Revísala completa antes de subirla.',
'Publica como si tu futura jefa o jefe fuera a leerlo. Lo que subes deja huella.',
'Ningún empleo legítimo te cobra por entrar ni te pide fotos de tus documentos por mensaje.',
'Puedes ignorar, bloquear y reportar. Cuidarte no es exagerar.'];
const BADGES=[['first','Primera publicación','Publica tu primer post'],['pic','Con imagen','Publica una imagen'],['talk','Conversador','Escribe 3 comentarios'],['net','Red en marcha','Llega a 3 conexiones'],['full','Perfil completo','Foto, titular, acerca de y 3 habilidades'],['eye','Ojo de halcón','Reporta un mensaje sospechoso'],['shield','Datos protegidos','Corrige una publicación con datos personales']];
const REQ={
b7:{msg:'Hola, soy docente de ciencias en la Preparatoria Aurora. Vi tu interés en proyectos escolares y me gustaría conectar para compartirte recursos y convocatorias abiertas.',
 fb:{aceptar:[true,'Buena decisión. El perfil tiene trayectoria clara, el mensaje es respetuoso y no pide datos personales ni dinero.',10],ignorar:[true,'Ignorar es válido, pero este contacto mostraba señales de confianza: mensaje claro, sin urgencia y sin pedir datos.',3],reportar:[false,'Reportar sirve para conductas riesgosas. Este contacto no pidió datos ni presionó, así que aceptar o ignorar era lo adecuado.',0]},
 flags:['Mensaje claro y respetuoso','Sin urgencia','No pide datos, dinero ni documentos','Perfil con trayectoria coherente']},
r2:{msg:'¡FELICIDADES! Fuiste seleccionado para un empleo remoto con pago de $8,000 semanales. Responde HOY con tu WhatsApp, tu dirección y una foto de tu credencial o perderás el lugar.',
 fb:{reportar:[true,'Excelente. Reportar protege a otras personas además de ti.',15],ignorar:[true,'Bien por no responder. Aun así, reportar ayuda a que esta cuenta deje de contactar a más personas.',6],aceptar:[false,'Alerta: aceptar le abre la puerta a más mensajes de esta persona. En el simulador no se creó la conexión.',0]},
 flags:['Urgencia: «HOY» o pierdes el lugar','Un premio o empleo que no solicitaste','Pide WhatsApp, dirección y foto de tu credencial','Pago muy alto sin experiencia ni entrevista','Perfil sin trayectoria que se pueda verificar']}};

const SEED=()=>{const m=60000,n=Date.now();return[
{id:'s1',a:'b1',type:'logro',text:'Terminé la identidad visual de una panadería del barrio. Lo que más aprendí: escuchar primero al cliente y diseñar después. #diseño #aprendizaje',at:n-35*m,likes:['b4','b6','b3'],cm:[{a:'b3',t:'¡Quedó precioso! Gracias por la paciencia.',at:n-20*m}],rp:0},
{id:'s2',a:'b2',type:'pregunta',text:'Para quienes empiezan en programación: ¿qué proyecto pequeño les ayudó a entender los ciclos y las condiciones? #programación',at:n-120*m,likes:['b1','b5'],cm:[{a:'b5',t:'Yo hice un contador de gastos. Muy útil.',at:n-90*m}],rp:0},
{id:'s3',a:'b4',type:'idea',text:'Tres preguntas antes de elegir carrera: ¿qué problema me gustaría resolver?, ¿con quién quiero trabajar? y ¿qué aprendo con facilidad? #orientación',at:n-300*m,likes:['b1','b2','b3','b5','b6'],cm:[],rp:0},
{id:'s4',a:'b3',type:'proyecto',text:'Arrancamos un taller de cocina sin desperdicio con jóvenes de bachillerato. Buscamos ideas de recetas con ingredientes que casi siempre se tiran. #emprendimiento #cocina',at:n-1500*m,likes:['b4','b6'],cm:[{a:'b6',t:'Cuenten conmigo para una charla sobre higiene.',at:n-1400*m}],rp:0},
{id:'s5',a:'b5',type:'logro',text:'Hoy certifiqué mi primera instalación eléctrica residencial. Un oficio bien hecho también es una carrera. #oficios',at:n-3000*m,likes:['b2','b4','b1'],cm:[],rp:0},
{id:'s6',a:'b6',type:'idea',text:'Consejo de la semana: antes de adoptar una mascota, visita un refugio y pregunta cómo es su rutina diaria. #bienestar',at:n-4300*m,likes:['b3'],cm:[],rp:0}]};
const fresh=()=>({me:null,posts:SEED(),queue:[],notifs:[],chats:{},unread:{},conns:[],sent:[],pending:['b7','r2'],res:{},pts:0,badges:[],counts:{comments:0},flags:{},tip:0});
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.posts)return r}catch(e){}return fresh()}
let S=load(),view='home',chat=null,draft={text:'',type:'idea',img:null,ok:false,warn:null},fileFor='post',editing=false,ed=null,editWarn=null,delAsk=null,confirmReset=false,chatWarn=null,dirty=false,toastT;
if(S.me){S.me.goal=S.me.goal||'';S.me.projects=S.me.projects||[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('Se llenó el espacio del navegador. Elimina alguna publicación con imagen.');return false}}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},4200)}
const who=id=>id==='me'?S.me:BOT[id];
const give=n=>{S.pts+=n};
const lvl=()=>{let i=0;LEVELS.forEach((l,k)=>{if(S.pts>=l[1])i=k});const nx=LEVELS[i+1];return{name:LEVELS[i][0],next:nx,pct:nx?Math.round((S.pts-LEVELS[i][1])/(nx[1]-LEVELS[i][1])*100):100}};
const typing=()=>{const a=document.activeElement;return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='checkbox'&&a.type!=='radio'};

/* seguridad */
function riskCheck(t){const r=[];
 (t.match(/\+?\d[\d\s().-]{7,}\d/g)||[]).some(m=>(m.match(/\d/g)||[]).length>=8)&&r.push('un número de teléfono o de identificación');
 /[\w.+-]+@[\w-]+\.[\w.]+/.test(t)&&r.push('un correo electrónico');
 /https?:\/\/|www\./i.test(t)&&r.push('un enlace externo');
 /\b(calle|colonia|avenida|av\.|fraccionamiento|c\.p\.|cp\s?\d{5})/i.test(t)&&r.push('una dirección');
 /\b[A-Z]{4}\d{6}[A-Z0-9]{0,8}\b/.test(t)&&r.push('una clave como CURP o RFC');
 /(estoy solo en casa|estoy sola en casa|mis pap[aá]s no est[aá]n)/i.test(t)&&r.push('información sobre cuándo estás sin compañía');
 /\b(idiota|est[uú]pid[oa]|pendej[oa]|imb[eé]cil|tarad[oa]|c[aá]llate)\b/i.test(t)&&r.push('lenguaje ofensivo (esta red practica el respeto)');

/* acciones */
function doPost(){const t=draft.text.trim();
 if(!t&&!draft.img){draft.warn=warnH('Escribe algo o agrega una imagen para publicar.',[]);return render()}
 const r=riskCheck(t);
 if(r.length){S.flags.warned=true;save();draft.warn=warnH('No se publicó. Revisa estos puntos:',r,true);return render()}
 if(draft.img&&!draft.ok){draft.warn=warnH('Confirma la revisión de tu imagen antes de publicar.',[]);return render()}
 const p={id:uid(),a:'me',type:draft.type,text:t,img:draft.img,at:Date.now(),likes:[],cm:[],rp:0};
 S.posts.unshift(p);if(S.flags.warned)S.flags.fixed=true;
 if(!save()){S.posts.shift();return render()}
 simPost(p);give(10);draft={text:'',type:'idea',img:null,ok:false,warn:null};save();checkBadges();save();toast('Publicado en tu muro de práctica (+10 puntos)');render()}
function doComment(id){const el=$('#c_'+id),t=el.value.trim();if(!t)return;
 const r=riskCheck(t);if(r.length){S.flags.warned=true;save();toast('Comentario no enviado. Evita compartir: '+r.join(', ')+'.');return}
 const p=S.posts.find(x=>x.id===id);p.cm.push({a:'me',t,at:Date.now()});S.counts.comments++;give(3);if(S.flags.warned)S.flags.fixed=true;
 if(p.a!=='me'&&Math.random()<.7)S.queue.push({k:'cm',p:id,b:p.a,x:pick(REPLY).replace('{n}',S.me.name.split(' ')[0]),at:Date.now()+(6+Math.random()*8)*1000});
 save();checkBadges();save();render()}
function doSend(){const el=$('#chatIn'),t=el.value.trim();if(!t)return;
 const r=riskCheck(t);if(r.length){S.flags.warned=true;save();chatWarn=warnH('Mensaje no enviado. Evita compartir:',r,true);return render()}
 chatWarn=null;(S.chats[chat]=S.chats[chat]||[]).push({f:'me',t,at:Date.now()});S.queue.push({k:'msg',b:chat,x:botReply(t),at:Date.now()+(2+Math.random()*3)*1000});save();render();$('#chatIn')&&$('#chatIn').focus()}
function doReq(id,c){if(!S.pending.includes(id))return;const [ok,t,pts]=REQ[id].fb[c];
 S.pending=S.pending.filter(x=>x!==id);S.res[id]={c,ok,t};give(pts);
 if(id==='b7'&&c==='aceptar'&&!S.conns.includes('b7')){S.conns.push('b7');welcome('b7')}
 if(id==='r2'&&c==='reportar')S.flags.eye=true;
 save();checkBadges();save();render()}
function handleFile(f){if(!f)return;if(!/^image\//.test(f.type)){toast('Elige un archivo de imagen.');return}
 if(f.size>10e6){toast('La imagen pesa demasiado. Elige una de menos de 10 MB.');return}
 const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),x=c.getContext('2d');
  if(fileFor==='avatar'){const m=Math.min(im.width,im.height);c.width=c.height=200;x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,200,200)}
  else{const s=Math.min(1,800/Math.max(im.width,im.height));c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);x.drawImage(im,0,0,c.width,c.height)}
  const d=c.toDataURL('image/jpeg',.72);
  if(fileFor==='avatar'){S.me.img=d;save();checkBadges();save()}else{draft.img=d;draft.ok=false;draft.warn=null}
  render()};im.onerror=()=>toast('No se pudo leer la imagen.');im.src=fr.result};fr.readAsDataURL(f)}
function startEdit(){const m=S.me;ed={name:m.name,head:m.head,area:m.area,goal:m.goal||'',about:m.about,c:m.c};editing=true;editWarn=null;chatWarn=null;render();scrollTo(0,0)}
function go(v){view=v;if(v!=='msg')chat=null;editing=false;ed=null;editWarn=null;confirmReset=false;delAsk=null;chatWarn=null;render();scrollTo(0,0)}
function act(a,d){switch(a){
 case'nav':go(d.v);break;
 case'type':draft.type=d.k;render();break;
 case'pick':fileFor='post';$('#file').click();break;
 case'avatar':fileFor='avatar';$('#file').click();break;
 case'rmimg':draft.img=null;draft.ok=false;render();break;
 case'post':doPost();break;
 case'like':{const p=S.posts.find(x=>x.id===d.id),i=p.likes.indexOf('me');if(i<0){p.likes.push('me');if(!p.lk){p.lk=1;give(1)}}else p.likes.splice(i,1);save();render();break}
 case'focus':{const el=$('#c_'+d.id);el&&el.focus();break}
 case'comment':doComment(d.id);break;
 case'rp':{const o=S.posts.find(x=>x.id===d.id);if(!o)break;S.posts.unshift({id:uid(),a:'me',type:'idea',text:'',of:o.id,at:Date.now(),likes:[],cm:[],rp:0});o.rp++;give(2);save();toast('Compartiste la publicación (+2 puntos)');render();break}
 case'del':if(delAsk===d.id){S.posts=S.posts.filter(p=>p.id!==d.id);S.queue=S.queue.filter(q=>q.p!==d.id);delAsk=null;save();toast('Publicación eliminada')}else delAsk=d.id;render();break;
 case'tip':S.tip=(S.tip+1)%TIPS.length;save();render();break;
 case'connect':if(!S.sent.includes(d.id)&&!S.conns.includes(d.id)){S.sent.push(d.id);give(5);S.queue.push({k:'acc',b:d.id,at:Date.now()+(6+Math.random()*8)*1000});save();toast('Solicitud enviada (+5 puntos)');render()}break;
 case'req':doReq(d.id,d.c);break;
 case'openchat':view='msg';chat=d.id;chatWarn=null;render();break;
 case'back':chat=null;chatWarn=null;render();break;
 case'send':doSend();break;
 case'addskill':{const el=$('#skillIn'),t=el.value.trim();if(!t)break;const r=riskCheck(t);if(r.length){toast('Esa habilidad contiene '+r[0]+'.');break}S.me.skills.push(t);save();checkBadges();save();render();break}
 case'rmskill':S.me.skills.splice(+d.i,1);save();render();break;
 case'edit':startEdit();break;
 case'cancel':editing=false;ed=null;editWarn=null;render();break;
 case'editme':view='me';chat=null;startEdit();break;
 case'rmavatar':S.me.img=null;save();render();break;
 case'addproj':{const t=$('#pj_t').value.trim(),dd=$('#pj_d').value.trim();if(!t){toast('Escribe el nombre del proyecto o logro.');break}const r=riskCheck(t+' '+dd);if(r.length){S.flags.warned=true;save();toast('Evita compartir: '+r.join(', ')+'.');break}S.me.projects=S.me.projects||[];S.me.projects.push({t,d:dd});give(3);save();toast('Proyecto agregado (+3 puntos)');render();break}
 case'rmproj':S.me.projects.splice(+d.i,1);save();render();break;
 case'reset':confirmReset=true;render();break;
 case'reset0':confirmReset=false;render();break;
 case'reset2':try{localStorage.removeItem(KEY)}catch(e){}S=fresh();view='home';chat=null;draft={text:'',type:'idea',img:null,ok:false,warn:null};confirmReset=false;render();break}}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el)act(el.dataset.act,el.dataset)});
document.addEventListener('input',e=>{if(e.target.id==='draftText'){draft.text=e.target.value;draft.warn=null;const w=document.querySelector('.compose .warn');if(w)w.remove();$('#cnt').textContent=draft.text.length+'/500'}});
document.addEventListener('input',e=>{const i=e.target.id;if(ed&&i&&i.startsWith('e_'))ed[i.slice(2)]=e.target.value});
document.addEventListener('change',e=>{if(e.target.name==='color'&&ed)ed.c=e.target.value;if(e.target.id==='imgOk')draft.ok=e.target.checked;if(e.target.id==='file'){handleFile(e.target.files[0]);e.target.value=''}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();const b=document.querySelector(`[data-act="${e.target.dataset.enter}"]${e.target.dataset.id?`[data-id="${e.target.dataset.id}"]`:''}`);b&&b.click()}});
document.addEventListener('submit',e=>{e.preventDefault();
 if(e.target.id==='ob'){const n=$('#f_name').value.trim(),h=$('#f_head').value.trim(),r=riskCheck(n+' '+h);
  if(r.length){$('#obwarn').innerHTML=warnH('Revisa estos puntos antes de continuar:',r,true);return}
  const col=document.querySelector('input[name=color]:checked').value;
  S.me={name:n,head:h,area:$('#f_area').value,about:'',goal:'',projects:[],skills:[],c:col,img:null};give(5);save();toast('Bienvenida o bienvenido a Enlaza Aula (+5 puntos)');render()}
 if(e.target.id==='pe'&&ed){const n=(ed.name||'').trim(),h=(ed.head||'').trim(),a=(ed.about||'').trim(),g=(ed.goal||'').trim(),r=riskCheck(n+' '+h+' '+a+' '+g);
  if(r.length){S.flags.warned=true;save();editWarn=warnH('No se guardó. Revisa estos puntos:',r,true);return render()}
  Object.assign(S.me,{name:n,head:h,about:a,goal:g,area:ed.area,c:ed.c});
  editing=false;editWarn=null;ed=null;if(S.flags.warned)S.flags.fixed=true;save();checkBadges();save();toast('Perfil actualizado');render()}});
render();tick();setInterval(tick,3000);
})();
</script>

</body></html>
